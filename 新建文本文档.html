<!DOCTYPE html>  
<html>  
<head>  
    <meta charset="UTF-8">  
    <title>我的照片分享</title>  
    <style>  
        .gallery {  
            display: grid;  
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));  
            gap: 10px;  
            padding: 20px;  
        }  
        .gallery img {  
            width: 100%;  
            height: 200px;  
            object-fit: cover;  
            border-radius: 8px;  
            cursor: pointer;  
            transition: transform 0.3s;  
        }  
        .gallery img:hover {  
            transform: scale(1.05);  
        }  
    </style>  
</head>  
<body>  
    <h1>📸 我的照片分享</h1>  
    <div class="gallery">  
        <img src="小A哥.jpg" alt="照片描述1">  
        <img src="照片2.jpg" alt="照片描述2">  
        <img src="照片3.jpg" alt="照片描述3">  
    </div>  
</body>  
</html>
