<!DOCTYPE html>  
<html lang="zh-CN">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>文件上传站</title>  
    <style>  
        * { margin: 0; padding: 0; box-sizing: border-box; }  
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }  
        .card { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 500px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }  
        h1 { text-align: center; color: #333; margin-bottom: 8px; font-size: 24px; }  
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; font-size: 14px; }  
        .drop-zone { border: 2px dashed #ccc; border-radius: 12px; padding: 40px 20px; text-align: center; cursor: pointer; transition: all 0.3s; background: #fafafa; }  
        .drop-zone:hover, .drop-zone.dragover { border-color: #667eea; background: #f0f2ff; }  
        .drop-zone .icon { font-size: 48px; margin-bottom: 12px; }  
        .drop-zone p { color: #666; font-size: 14px; }  
        .drop-zone .hint { color: #aaa; font-size: 12px; margin-top: 8px; }  
        .file-list { margin-top: 20px; }  
        .file-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #f5f5f5; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }  
        .file-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }  
        .file-item .size { color: #999; margin: 0 12px; white-space: nowrap; }  
        .file-item .remove { color: #e74c3c; cursor: pointer; font-weight: bold; }  
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; margin-top: 20px; }  
        .btn-upload { background: #667eea; color: white; }  
        .btn-upload:hover { background: #5a6fd6; }  
        .btn-upload:disabled { background: #ccc; cursor: not-allowed; }  
        .progress { margin-top: 20px; display: none; }  
        .progress-bar { height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden; }  
        .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); width: 0%; transition: width 0.3s; border-radius: 3px; }  
        .progress-text { text-align: center; color: #666; font-size: 13px; margin-top: 6px; }  
        .result { margin-top: 20px; display: none; }  
        .result-item { background: #f0f8ff; border: 1px solid #b8d4fe; border-radius: 8px; padding: 12px; margin-bottom: 8px; word-break: break-all; font-size: 13px; }  
        .result-item a { color: #667eea; text-decoration: none; }  
        .result-item a:hover { text-decoration: underline; }  
        .result-item .label { font-weight: 600; color: #333; display: block; margin-bottom: 4px; }  
        .hidden-input { display: none; }  
        .status-msg { text-align: center; color: #e74c3c; font-size: 13px; margin-top: 10px; display: none; }  
    </style>  
</head>  
<body>  
<div class="card">  
    <h1>📁 文件上传站</h1>  
    <p class="subtitle">拖拽或点击选择文件，上传后获取分享链接</p>  
  
    <div class="drop-zone" id="dropZone">  
        <div class="icon">📤</div>  
        <p>拖拽文件到此处</p>  
        <p class="hint">或点击选择文件（单次最多 5 个）</p>  
    </div>  
    <input type="file" id="fileInput" class="hidden-input" multiple>  
  
    <div class="file-list" id="fileList"></div>  
  
    <button class="btn btn-upload" id="uploadBtn" disabled>⬆ 上传文件</button>  
  
    <div class="progress" id="progress">  
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>  
        <div class="progress-text" id="progressText">准备中...</div>  
    </div>  
  
    <div class="status-msg" id="statusMsg"></div>  
  
    <div class="result" id="result"></div>  
</div>  
  
<script>  
const dropZone = document.getElementById('dropZone');  
const fileInput = document.getElementById('fileInput');  
const fileList = document.getElementById('fileList');  
const uploadBtn = document.getElementById('uploadBtn');  
const progress = document.getElementById('progress');  
const progressFill = document.getElementById('progressFill');  
const progressText = document.getElementById('progressText');  
const result = document.getElementById('result');  
const statusMsg = document.getElementById('statusMsg');  
  
let selectedFiles = [];  
  
// 点击上传区触发文件选择  
dropZone.addEventListener('click', () => fileInput.click());  
  
// 文件选择变化  
fileInput.addEventListener('change', (e) => {  
    addFiles(e.target.files);  
    e.target.value = '';  
});  
  
// 拖拽事件  
dropZone.addEventListener('dragover', (e) => {  
    e.preventDefault();  
    dropZone.classList.add('dragover');  
});  
dropZone.addEventListener('dragleave', () => {  
    dropZone.classList.remove('dragover');  
});  
dropZone.addEventListener('drop', (e) => {  
    e.preventDefault();  
    dropZone.classList.remove('dragover');  
    addFiles(e.dataTransfer.files);  
});  
  
function addFiles(files) {  
    for (let f of files) {  
        if (f.size > 100 * 1024 * 1024) {  
            showStatus(`文件 "${f.name}" 超过 100MB 限制，已跳过`);  
            continue;  
        }  
        selectedFiles.push(f);  
    }  
    renderFileList();  
}  
  
function renderFileList() {  
    fileList.innerHTML = '';  
    if (selectedFiles.length === 0) {  
        uploadBtn.disabled = true;  
        return;  
    }  
    uploadBtn.disabled = false;  
    selectedFiles.forEach((f, i) => {  
        const div = document.createElement('div');  
        div.className = 'file-item';  
        const size = f.size > 1024 * 1024  
            ? (f.size / 1024 / 1024).toFixed(1) + ' MB'  
            : (f.size / 1024).toFixed(1) + ' KB';  
        div.innerHTML = `  
            <span class="name">${f.name}</span>  
            <span class="size">${size}</span>  
            <span class="remove" data-index="${i}">✕</span>  
        `;  
        fileList.appendChild(div);  
    });  
    document.querySelectorAll('.remove').forEach(el => {  
        el.addEventListener('click', () => {  
            const idx = parseInt(el.dataset.index);  
            selectedFiles.splice(idx, 1);  
            renderFileList();  
        });  
    });  
}  
  
function showStatus(msg) {  
    statusMsg.textContent = msg;  
    statusMsg.style.display = 'block';  
    setTimeout(() => { statusMsg.style.display = 'none'; }, 4000);  
}  
  
uploadBtn.addEventListener('click', async () => {  
    if (selectedFiles.length === 0) return;  
    uploadBtn.disabled = true;  
    progress.style.display = 'block';  
    result.style.display = 'none';  
    result.innerHTML = '';  
    statusMsg.style.display = 'none';  
  
    const results = [];  
    let completed = 0;  
  
    for (let file of selectedFiles) {  
        progressText.textContent = `正在上传: ${file.name} (${completed + 1}/${selectedFiles.length})`;  
        progressFill.style.width = '0%';  
  
        try {  
            const formData = new FormData();  
            formData.append('files[]', file);  
  
            // 使用 pomf.lol 免费文件托管 API  
            const resp = await fetch('https://pomf.lol/upload.php', {  
                method: 'POST',  
                body: formData  
            });  
            const data = await resp.json();  
  
            if (data.success && data.files && data.files.length > 0) {  
                results.push({  
                    name: file.name,  
                    url: data.files[0].url,  
                    size: file.size  
                });  
            } else {  
                results.push({ name: file.name, error: '上传失败', url: null });  
            }  
        } catch (err) {  
            results.push({ name: file.name, error: err.message, url: null });  
        }  
  
        completed++;  
        progressFill.style.width = Math.round((completed / selectedFiles.length) * 100) + '%';  
    }  
  
    progressFill.style.width = '100%';  
    progressText.textContent = '上传完成！';  
  
    // 显示结果  
    result.style.display = 'block';  
    let html = '<h3 style="margin-bottom:12px;font-size:16px;color:#333;">✅ 上传结果</h3>';  
    results.forEach(r => {  
        if (r.url) {  
            html += `<div class="result-item">  
                <span class="label">${r.name}</span>  
                <a href="${r.url}" target="_blank">${r.url}</a>  
            </div>`;  
        } else {  
            html += `<div class="result-item" style="background:#fff0f0;border-color:#fcc;">  
                <span class="label">${r.name}</span>  
                <span style="color:#e74c3c;">❌ ${r.error || '上传失败'}</span>  
            </div>`;  
        }  
    });  
    result.innerHTML = html;  
  
    uploadBtn.disabled = false;  
    selectedFiles = [];  
    renderFileList();  
});  
</script>  
</body>  
</html>
